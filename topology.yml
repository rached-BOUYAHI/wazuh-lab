name: wazuh-siem-lab-light

# =============================================================================
# ULTRA-LIGHT VERSION - Single Router Architecture
# Uses only 5 VMs instead of 8 to minimize resource usage
# =============================================================================

hosts:
  # Wazuh Manager - Central SIEM Server
  - name: wazuh-manager
    base_box:
      image: debian-12-x86_64
      man_user: debian
    flavor: m1.tiny
    hidden: false

  # Web Server - Monitored Asset
  - name: web-server
    base_box:
      image: debian-12-x86_64
      man_user: debian
    flavor: m1.tiny
    hidden: false

  # Database Server - Monitored Asset
  - name: db-server
    base_box:
      image: debian-12-x86_64
      man_user: debian
    flavor: m1.tiny
    hidden: false

  # Kali Attacker - Red Team Machine
  - name: kali-attacker
    base_box:
      image: debian-12-x86_64
      man_user: debian
    flavor: m1.tiny
    hidden: false

# =============================================================================
# ROUTERS - Single Central Router (saves 3 VMs!)
# =============================================================================
routers:
  - name: central-router
    base_box:
      image: debian-12-x86_64
      man_user: debian
    flavor: m1.tiny

# =============================================================================
# NETWORKS - Same 4-tier architecture
# =============================================================================
networks:
  - name: mgmt-network
    cidr: 10.10.10.0/24
    accessible_by_user: false

  - name: dmz-network
    cidr: 10.10.20.0/24
    accessible_by_user: false

  - name: internal-network
    cidr: 10.10.30.0/24
    accessible_by_user: false

  - name: attacker-network
    cidr: 10.10.40.0/24
    accessible_by_user: true

# =============================================================================
# NET_MAPPINGS - Host to Network assignments
# =============================================================================
net_mappings:
  - host: wazuh-manager
    network: mgmt-network
    ip: 10.10.10.10

  - host: web-server
    network: dmz-network
    ip: 10.10.20.10

  - host: db-server
    network: internal-network
    ip: 10.10.30.10

  - host: kali-attacker
    network: attacker-network
    ip: 10.10.40.10

# =============================================================================
# ROUTER_MAPPINGS - Single router connected to all networks
# =============================================================================
router_mappings:
  - router: central-router
    network: mgmt-network
    ip: 10.10.10.1

  - router: central-router
    network: dmz-network
    ip: 10.10.20.1

  - router: central-router
    network: internal-network
    ip: 10.10.30.1

  - router: central-router
    network: attacker-network
    ip: 10.10.40.1

# =============================================================================
# GROUPS
# =============================================================================
groups:
  - name: wazuh-servers
    nodes:
      - wazuh-manager

  - name: wazuh-agents
    nodes:
      - web-server
      - db-server

  - name: attackers
    nodes:
      - kali-attacker

  - name: protected-assets
    nodes:
      - web-server
      - db-server
