name: wazuh-siem-lab-full-optimized

# =============================================================================
# FULL 4-ROUTER TOPOLOGY WITH CUSTOM FLAVORS
# Uses oryx.micro for routers to minimize resource usage
# Total: 9 vCPUs, ~4.5 GB RAM (fits in 40-core quota: 19 + 9 = 28)
# =============================================================================

hosts:
  # Wazuh Manager - Central SIEM Server
  - name: wazuh-manager
    base_box:
      image: debian-12-x86_64
      man_user: debian
    flavor: oryx.small  # 2 vCPU, 2 GB RAM
    hidden: false

  # Web Server - Monitored Asset (DMZ)
  - name: web-server
    base_box:
      image: debian-12-x86_64
      man_user: debian
    flavor: oryx.tiny  # 1 vCPU, 512 MB RAM
    hidden: false

  # Database Server - Monitored Asset (Internal)
  - name: db-server
    base_box:
      image: debian-12-x86_64
      man_user: debian
    flavor: oryx.tiny  # 1 vCPU, 512 MB RAM
    hidden: false

  # Kali Attacker - Red Team Machine
  - name: kali-attacker
    base_box:
      image: debian-12-x86_64
      man_user: debian
    flavor: oryx.tiny  # 1 vCPU, 512 MB RAM
    hidden: false

# =============================================================================
# ROUTERS - 4 separate routers for realistic network segmentation
# =============================================================================
routers:
  # Management Router
  - name: mgmt-router
    base_box:
      image: debian-12-x86_64
      man_user: debian
    flavor: oryx.micro  # 1 vCPU, 256 MB RAM

  # DMZ Router
  - name: dmz-router
    base_box:
      image: debian-12-x86_64
      man_user: debian
    flavor: oryx.micro  # 1 vCPU, 256 MB RAM

  # Internal Router
  - name: internal-router
    base_box:
      image: debian-12-x86_64
      man_user: debian
    flavor: oryx.micro  # 1 vCPU, 256 MB RAM

  # Attacker Router
  - name: attacker-router
    base_box:
      image: debian-12-x86_64
      man_user: debian
    flavor: oryx.micro  # 1 vCPU, 256 MB RAM

# =============================================================================
# NETWORKS - 4-tier architecture
# =============================================================================
networks:
  - name: mgmt-network
    cidr: 10.10.10.0/24
    accessible_by_user: false

  - name: dmz-network
    cidr: 10.10.20.0/24
    accessible_by_user: false

  - name: internal-network
    cidr: 10.10.30.0/24
    accessible_by_user: false

  - name: attacker-network
    cidr: 10.10.40.0/24
    accessible_by_user: true

# =============================================================================
# NET_MAPPINGS
# =============================================================================
net_mappings:
  - host: wazuh-manager
    network: mgmt-network
    ip: 10.10.10.10

  - host: web-server
    network: dmz-network
    ip: 10.10.20.10

  - host: db-server
    network: internal-network
    ip: 10.10.30.10

  - host: kali-attacker
    network: attacker-network
    ip: 10.10.40.10

# =============================================================================
# ROUTER_MAPPINGS
# =============================================================================
router_mappings:
  # Management Router
  - router: mgmt-router
    network: mgmt-network
    ip: 10.10.10.1

  # DMZ Router
  - router: dmz-router
    network: dmz-network
    ip: 10.10.20.1

  # Internal Router
  - router: internal-router
    network: internal-network
    ip: 10.10.30.1

  # Attacker Router
  - router: attacker-router
    network: attacker-network
    ip: 10.10.40.1

# =============================================================================
# GROUPS
# =============================================================================
groups:
  - name: wazuh-servers
    nodes:
      - wazuh-manager

  - name: wazuh-agents
    nodes:
      - web-server
      - db-server

  - name: attackers
    nodes:
      - kali-attacker

  - name: protected-assets
    nodes:
      - web-server
      - db-server
