name: wazuh-siem-lab-working

# =============================================================================
# WORKING TOPOLOGY - NO ROUTERS (KYPO routers can be problematic)
# Direct network connections work reliably
# Total: 5 VMs, 6 vCPUs, ~4 GB RAM
# =============================================================================

hosts:
  # Wazuh Manager - Central SIEM Server
  - name: wazuh-manager
    base_box:
      image: debian-12-x86_64
      man_user: debian
    flavor: m1.small  # 2 vCPU, 2 GB RAM, 20 GB disk
    hidden: false

  # Web Server - Monitored Asset (DMZ)
  - name: web-server
    base_box:
      image: debian-12-x86_64
      man_user: debian
    flavor: m1.tiny  # 1 vCPU, 512 MB RAM, 10 GB disk (we fixed this!)
    hidden: false

  # Database Server - Monitored Asset (Internal)
  - name: db-server
    base_box:
      image: debian-12-x86_64
      man_user: debian
    flavor: m1.tiny  # 1 vCPU, 512 MB RAM, 10 GB disk
    hidden: false

  # Kali Attacker - Red Team Machine
  - name: kali-attacker
    base_box:
      image: debian-12-x86_64
      man_user: debian
    flavor: m1.tiny  # 1 vCPU, 512 MB RAM, 10 GB disk
    hidden: false

# =============================================================================
# NETWORKS - Simplified 2-network architecture
# =============================================================================
networks:
  # Management/Protected Network - Wazuh Manager + Protected Assets
  - name: protected-network
    cidr: 10.10.10.0/24
    accessible_by_user: false

  # Attacker Network - Kali machine (simulates internet)
  - name: attacker-network
    cidr: 10.10.40.0/24
    accessible_by_user: true

# =============================================================================
# NET_MAPPINGS - All on same network for simplicity
# =============================================================================
net_mappings:
  # Wazuh Manager
  - host: wazuh-manager
    network: protected-network
    ip: 10.10.10.10

  # Web Server (will be attack target)
  - host: web-server
    network: protected-network
    ip: 10.10.10.20

  # Database Server
  - host: db-server
    network: protected-network
    ip: 10.10.10.30

  # Kali Attacker (on separate network)
  - host: kali-attacker
    network: attacker-network
    ip: 10.10.40.10

# =============================================================================
# GROUPS
# =============================================================================
groups:
  - name: wazuh-servers
    nodes:
      - wazuh-manager

  - name: wazuh-agents
    nodes:
      - web-server
      - db-server

  - name: attackers
    nodes:
      - kali-attacker

  - name: protected-assets
    nodes:
      - web-server
      - db-server
